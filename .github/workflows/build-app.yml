# Builds the Catalyst desktop app for Windows AND macOS.
#
# macOS cannot be cross-compiled from Windows, so the Mac build happens here on a
# GitHub-hosted macOS runner. Push a tag like `app-v1.4.0` (or run this manually) and it
# produces a Windows installer + a universal macOS .dmg and attaches them to a draft release.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of .keys/catalyst-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password (empty string if none)
name: Build Catalyst App

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest       # universal (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # The console is a separate repo with its own release cadence, so it is fetched rather than
      # vendored into git. tauri.conf.json declares resources/console/*, and a resource glob that
      # matches nothing fails the build - which is exactly how the first tagged build broke.
      - name: Fetch Catalyst Console
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/console | Out-Null
          try {
            gh release download --repo TomAs-1226/CatalystConsole --pattern 'catalyst-console.exe' --dir src-tauri/resources/console --clobber
            Write-Host "bundled Catalyst Console from its latest release"
          } catch {
            # Ship without it rather than block the app's release. The app asks console_available()
            # and hides the entry, so a build with no console is coherent - just less useful.
            Write-Warning "no Catalyst Console release available; building without it"
            Set-Content -Path src-tauri/resources/console/.gitkeep -Value '' -Encoding utf8
          }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "Catalyst App v__VERSION__"
          releaseBody: "Optional Catalyst desktop app. Windows installer + universal macOS .dmg. This release also carries the signed `latest.json` the app's auto-updater pulls from."
          releaseDraft: false
