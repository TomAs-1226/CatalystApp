<?xml version="1.0" encoding="UTF-8"?>
<!-- Catalyst desktop app social / OG card. 1280x640, the size GitHub asks for and the size
     Open Graph and every link unfurler crop to. Standalone: no external references, no raster,
     no webfont.

     SHIP THE PNG, NOT THIS FILE. This SVG is the source; social-card.png beside it is what
     actually gets used. GitHub's Settings -> Social preview uploader takes PNG/JPG/GIF only, and
     no major unfurler - X, Slack, Discord, Facebook, LinkedIn - renders an SVG og:image. An SVG
     pointed at any of them shows nothing at all, which is worse than an ugly card. The SVG is
     still the right thing to <img> into a README, where GitHub does render it.

     Regenerate the PNG after any edit here. Run msedge (or any Chromium) with these flags, each
     written with the usual leading double hyphen - a pair of them cannot appear literally inside
     an XML comment, which is why they are listed rather than pasted:

       headless=new, disable-gpu, hide-scrollbars, force-device-scale-factor=1,
       window-size=1280,640, screenshot=social-card.png

     and point it at file:///<abs path>/wrapper.html, where wrapper.html is a page carrying
     body{margin:0;background:#0b0f1a} and one <img src="social-card.svg"
     style="width:1280px;height:640px">. The opaque body matters: a transparent PNG is
     composited on white by the unfurlers and the rounded corners flash.

     Same family as the library's banner.svg and social-card.svg - navy ground, hairline grid,
     coral bolt in a rounded panel, wordmark, sub-line, version chip. The motif in the corner
     is this product's own noun: a window with a tool list, drawn in hairline white because it
     is texture and the accent has one job on this card.

     Font families are written onto each text element rather than into an internal <style>,
     because GitHub strips <style> when it sanitises inline SVG and this card would fall back
     to a serif face in the one place it is seen most. Figures are set in the mono stack, which
     is tabular by construction and needs no font-feature attribute to survive sanitising.

     Tokens: #0b0f1a ground, #111726 panel, #182034 raised, rgba(255,255,255,0.07/0.13)
     hairlines, #e94560 the single accent, #f4f7fc / #d5dbe8 / #7f8aa3 text. Amber appears once
     and it is carrying state - the library this installs is a beta - not decoration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img"
     aria-label="Catalyst App 2.6.1 &#8212; the desktop companion for FrcCatalyst, on Windows and macOS. Every Catalyst tool in one window, offline, and it installs the library into your GradleRIO project. The app is a release; the library it installs is not. It installs Catalyst 2.0.0-beta.1, which has never been driven on a robot and needs WPILib 2027.0.0-alpha-7 and Systemcore OS beta 14. Flash the OS first. Teams competing this season stay on 1.x, which this app does not bundle.">
  <title>Catalyst App 2.6.1</title>

  <defs>
    <clipPath id="appCardClip">
      <rect x="0" y="0" width="1280" height="640" rx="20"/>
    </clipPath>
    <!-- Ground, not signal. At 9% it cannot be mistaken for something marked. -->
    <radialGradient id="appCardWash" cx="90%" cy="-4%" r="62%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#appCardClip)">
    <rect x="0" y="0" width="1280" height="640" fill="#0b0f1a"/>
    <rect x="0" y="0" width="1280" height="640" fill="url(#appCardWash)"/>

    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <path d="M64.5 0V640M128.5 0V640M192.5 0V640M256.5 0V640M320.5 0V640M384.5 0V640M448.5 0V640M512.5 0V640M576.5 0V640M640.5 0V640M704.5 0V640M768.5 0V640M832.5 0V640M896.5 0V640M960.5 0V640M1024.5 0V640M1088.5 0V640M1152.5 0V640M1216.5 0V640"/>
      <path d="M0 64.5H1280M0 128.5H1280M0 192.5H1280M0 256.5H1280M0 320.5H1280M0 384.5H1280M0 448.5H1280M0 512.5H1280M0 576.5H1280"/>
    </g>

    <!-- One window, a tool list down the side. Suggested, not drawn: at the size a link
         preview is actually seen this is a shape, and a shape is all it needs to be. -->
    <g>
      <rect x="1000" y="76" width="184" height="128" rx="14"
            fill="#111726" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M1046.5 76V204" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
      <g fill="#ffffff" fill-opacity="0.13">
        <rect x="1012" y="98" width="22" height="6" rx="3"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.07">
        <rect x="1012" y="120" width="22" height="6" rx="3"/>
        <rect x="1012" y="142" width="22" height="6" rx="3"/>
        <rect x="1012" y="164" width="22" height="6" rx="3"/>
      </g>
      <rect x="1062" y="98" width="104" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <g fill="#ffffff" fill-opacity="0.07">
        <rect x="1062" y="122" width="76" height="8" rx="4"/>
        <rect x="1062" y="146" width="92" height="8" rx="4"/>
        <rect x="1062" y="170" width="58" height="8" rx="4"/>
      </g>
    </g>

    <rect x="0" y="634" width="1280" height="6" fill="#e94560"/>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="639" rx="19.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- The mark: the library's panel-and-bolt, unchanged. The app is Catalyst, so it wears the
       same face and separates itself with the second half of the wordmark. -->
  <rect x="80" y="76" width="128" height="128" rx="32"
        fill="#111726" stroke="#ffffff" stroke-opacity="0.13"/>
  <g transform="translate(99.15 93.2) scale(3.9)">
    <path d="M13 2L3 14h7v8l10-12h-7V2z" fill="#e94560"/>
  </g>

  <!-- One text element with two tspans rather than two absolutely-placed texts. The second
       flows off the end of the first whatever the viewer's fonts turn out to be, which matters
       here: this is rendered by GitHub on someone else's machine, and a hard-coded offset that
       looks right in Segoe UI opens a gap or an overlap in anything else. -->
  <text x="248" y="166"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="72"><tspan font-weight="800" letter-spacing="-1.4" fill="#f4f7fc">Catalyst</tspan><tspan
        font-weight="300" letter-spacing="-0.8" fill="#7f8aa3" dx="18">App</tspan></text>

  <text x="80" y="262"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" fill="#d5dbe8">Every Catalyst tool in one window, offline.</text>

  <text x="80" y="298"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="#7f8aa3">Installs the library into your GradleRIO project, checks it first, and updates itself.</text>

  <!-- Version reads as data, so it gets a neutral chip. Making it coral would put the accent
       on a string nobody clicks. -->
  <rect x="80" y="330" width="128" height="36" rx="9"
        fill="#182034" stroke="#ffffff" stroke-opacity="0.13"/>
  <text x="144" y="354" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
        font-size="17" letter-spacing="0.3" fill="#f4f7fc">v2.6.1</text>

  <!-- The app is a release; the library it installs is not. A chip reading PRE-SEASON sitting
       beside the app's own version chip attaches to that version, and 2.6.1 is a shipped release
       - so the chip has to name its subject. Amber still carries the state, but the state it
       names is now the true one. -->
  <rect x="224" y="330" width="176" height="36" rx="9"
        fill="none" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="312" y="354" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="700" letter-spacing="0.85" fill="#fbbf24">INSTALLS A BETA</text>

  <rect x="80" y="406" width="1120" height="1" fill="#ffffff" fill-opacity="0.07"/>

  <!-- What this card is for. The lower register used to open with a feature list - tools,
       registry, MCP - and put the beta in the muted footnote under it. On an installer's card
       that is the wrong way round: the fact a team needs before they click is what this thing
       is about to put into their robot project. The never-driven line gets the brightest text
       token and a line of its own, the way it does on the library's card. -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="22" font-weight="400">
    <text x="80" y="458" fill="#d5dbe8">It installs Catalyst 2.0.0-beta.1, so you can port to WPILib</text>
    <text x="80" y="490" fill="#d5dbe8">2027 over the offseason instead of in January.</text>
    <text x="80" y="522" fill="#f4f7fc" font-weight="600">That library has never been driven on a robot.</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="19" font-weight="400" fill="#7f8aa3">
    <text x="80" y="562">Flash Systemcore OS beta 14 first: a build against alpha-7 aborts on beta 13.</text>
    <text x="80" y="590">Competing this season? Stay on 1.x &#8212; the app does not bundle it.</text>
  </g>

  <!-- Figures panel. Depth by ground, never by shadow; values in the mono stack so the digits
       are tabular and the column edge stays straight. -->
  <rect x="836" y="428" width="364" height="176" rx="14"
        fill="#111726" stroke="#ffffff" stroke-opacity="0.07"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#7f8aa3">
    <text x="864" y="467">INSTALLS</text>
    <text x="864" y="501">WPILIB</text>
    <text x="864" y="535">SYSTEMCORE OS</text>
    <text x="864" y="569">PLATFORMS</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
     font-size="17.5" fill="#f4f7fc" text-anchor="end" font-variant-numeric="tabular-nums">
    <text x="1172" y="467">2.0.0-beta.1</text>
    <text x="1172" y="501">2027.0.0-alpha-7</text>
    <text x="1172" y="535">beta 14</text>
    <text x="1172" y="569">Windows &#183; macOS</text>
  </g>
</svg>
